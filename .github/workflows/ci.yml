name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Lint the extension (web-ext)
        run: npm run lint
      - name: Build the package
        run: npm run build
      # Keep the exact artifact CI produced, so a release can be compared against it.
      - uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: dist/*.zip
