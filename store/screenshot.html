<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Store screenshot — 1280x800</title>
    <style>
      /* Authored at exactly 1280x800, the canvas both stores accept, and captured 1:1 by
         scripts/make-screenshot.sh so there is no resampling and nothing to crop. */
      html, body { margin: 0; padding: 0; background: #0f1115; }
      .sheet {
        width: 1280px;
        height: 800px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 34px;
        background: #0f1115;
        color: #e8eaed;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      h1 { font-size: 34px; margin: 0; font-weight: 650; letter-spacing: -0.4px; }
      p { margin: 0; color: #9aa1ad; font-size: 18px; max-width: 720px; text-align: center; }
      /* The real popup, at its real width, rendered by the browser rather than drawn by hand —
         a store screenshot has to be the product, not an illustration of it. */
      .frame {
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
        border: 1px solid #2a2f3a;
        background: #fff;
      }
      /* The popup body is 320px wide *plus* its own 14px padding on each side; sizing the frame
         to 320 clips the right-hand edge of every line of text. */
      iframe { width: 348px; height: 352px; border: 0; display: block; }
    </style>
  </head>
  <body>
    <div class="sheet">
        <h1>Export your session, locally</h1>
        <p>Pick the service you are signed in to, copy the cookies, paste them into your own
          Universal Claimer. Nothing is ever sent anywhere.</p>
      <div class="frame">
        <iframe src="../src/popup.html" title="Extension popup"></iframe>
      </div>
    </div>
  </body>
</html>
